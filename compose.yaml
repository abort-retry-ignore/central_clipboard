services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      CLIP_JOIN_PASSPHRASE: ${CLIP_JOIN_PASSPHRASE:-}
      CLIP_TOKENS: ${CLIP_TOKENS:-}
      CLIP_PERSIST_CLIP: ${CLIP_PERSIST_CLIP:-false}
      CLIP_MAX_BYTES: ${CLIP_MAX_BYTES:-8388608}
    # Publish only on this host's Tailscale address so the hub is reachable from
    # the tailnet and nowhere else.
    ports:
      - "${BIND_IP:?set BIND_IP in .env to this host's tailscale ip}:${CLIP_PORT:-8766}:8766"
    volumes:
      - clip-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  clip-data:
