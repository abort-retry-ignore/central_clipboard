name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-hub

jobs:
  # The hub's tests run inside its image, natively on both architectures.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the hub image
        run: docker build -t hub:test hub
      - name: Unit tests
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python
          hub:test -B -m unittest discover -s tests -v

  # Hub + two agents on two headless Sway sessions + a fake phone.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end test
        run: >
          docker run --rm --cap-add SYS_NICE -v "$PWD:/src:ro" alpine:3 sh -c
          'apk add -q bash curl python3 sway wl-clipboard >/dev/null && bash /src/tests/e2e-wayland.sh'

  publish:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the manifest covers both architectures
        run: |
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
