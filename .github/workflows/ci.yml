name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-hub
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/mipsle

jobs:
  # gofmt, vet and the Go tests run inside the build, natively on both architectures.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test .

  # The hub and two agents that join through /install.sh, each on a headless Sway.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the hub binary
        run: docker build --target bin --output type=local,dest=out .
      - name: End-to-end test
        run: >
          docker run --rm --cap-add SYS_NICE -v "$PWD:/src:ro" alpine:3 sh -c
          'apk add -q bash curl sway wl-clipboard >/dev/null && bash /src/tests/e2e-wayland.sh'

  publish:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The manifest covers every platform
        run: |
          docker buildx imagetools inspect "$IMAGE@${{ steps.build.outputs.digest }}" | tee manifest.txt
          for p in ${PLATFORMS//,/ }; do grep -q "Platform: *$p\$" manifest.txt || { echo "missing $p"; exit 1; }; done
      # mipsle is built and in the manifest but never executed in CI
      - name: The binary starts on each platform QEMU can run
        run: |
          for p in linux/amd64 linux/arm64 linux/arm/v7 linux/arm/v6; do
            printf '%s: ' "$p"; docker run --rm --platform "$p" "$IMAGE@${{ steps.build.outputs.digest }}" version
          done
